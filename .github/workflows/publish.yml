name: Publish Mobile Release

on:
  push:
    branches: [main]
    paths:
      - app.json

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app version bump
        id: version
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_VERSION=$(jq -r '.expo.version // empty' app.json)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Missing expo.version in app.json" >&2
            exit 1
          fi

          if ! echo "$CURRENT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid expo.version: $CURRENT_VERSION" >&2
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA:app.json"; then
            PREVIOUS_VERSION=$(git show "$BEFORE_SHA:app.json" | jq -r '.expo.version // empty')
          fi

          echo "Previous app version: ${PREVIOUS_VERSION:-<missing>}"
          echo "Current app version: $CURRENT_VERSION"

          echo "app_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=mobile-v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          if [ "$PREVIOUS_VERSION" = "$CURRENT_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs:
      - detect-version-bump
      - lint
    if: needs.detect-version-bump.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx jest --passWithNoTests

  release-apk:
    runs-on: ubuntu-latest
    needs:
      - detect-version-bump
      - test
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: ${{ needs.detect-version-bump.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.detect-version-bump.outputs.build_number }}
      RELEASE_TAG: ${{ needs.detect-version-bump.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync native app versions
        run: |
          echo "Using app.json version $APP_VERSION"
          echo "Using build number $BUILD_NUMBER"

          perl -0pi -e 's/versionName "[^"]+"/versionName "$ENV{APP_VERSION}"/g' android/app/build.gradle
          perl -0pi -e 's/versionCode \d+/versionCode $ENV{BUILD_NUMBER}/g' android/app/build.gradle

          if [ -f ios/LocalLoop/Info.plist ]; then
            perl -0pi -e 's#(<key>CFBundleShortVersionString</key>\s*<string>)[^<]+(</string>)#$1$ENV{APP_VERSION}$2#s' ios/LocalLoop/Info.plist
            perl -0pi -e 's#(<key>CFBundleVersion</key>\s*<string>)[^<]+(</string>)#$1$ENV{BUILD_NUMBER}$2#s' ios/LocalLoop/Info.plist
          fi

          if [ -f ios/LocalLoop.xcodeproj/project.pbxproj ]; then
            perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $ENV{APP_VERSION};/g' ios/LocalLoop.xcodeproj/project.pbxproj
            perl -0pi -e 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g' ios/LocalLoop.xcodeproj/project.pbxproj
          fi

          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n -A1 "CFBundleShortVersionString\|CFBundleVersion" ios/LocalLoop/Info.plist || true

      # TODO: Re-enable iOS build once we have apple dev account
      # - name: Build and Download IPA
      #   run: |
      #     eas build \
      #       --platform ios \
      #       --profile production \
      #       --non-interactive \
      #       --wait \
      #       --json > build.json

      # - name: Extract build URL
      #   id: build-ipa
      #   run: |
      #     BUILD_URL=$(cat build.json | jq -r '.[0].artifacts.buildUrl')
      #     echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      # - name: Download IPA
      #   run: |
      #     mkdir -p builds
      #     curl -L "${{ steps.build.outputs.build_url }}" \
      #       --output builds/app.ipa

      # - name: Publish Release
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: ./builds/app.ipa
      #     tag_name: ${{ github.ref_name }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APK on EAS
        id: build-apk
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --json --wait)
          echo "$BUILD_JSON"
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl')
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Failed to extract APK URL from EAS build output" >&2
            exit 1
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -fL -o localloop.apk "${{ steps.build-apk.outputs.apk_url }}"

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            ./localloop.apk \
            --target "${{ github.sha }}" \
            --title "LocalLoop Mobile $APP_VERSION" \
            --notes "App version: $APP_VERSION
          Build number: $BUILD_NUMBER
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}"
