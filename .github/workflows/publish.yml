name: Publish Mobile Release

on:
  push:
    branches: [main]
    paths:
      - app.json

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      app_version: ${{ steps.release.outputs.app_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      build_number: ${{ steps.release.outputs.build_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect app version bump
        id: release
        run: npm run release:detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_NUMBER: ${{ github.run_number }}

  lint:
    runs-on: ubuntu-latest
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs:
      - detect-version-bump
      - lint
    if: needs.detect-version-bump.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx jest --passWithNoTests

  release-apk:
    runs-on: ubuntu-latest
    needs:
      - detect-version-bump
      - test
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: ${{ needs.detect-version-bump.outputs.app_version }}
      BUILD_NUMBER: ${{ needs.detect-version-bump.outputs.build_number }}
      RELEASE_TAG: ${{ needs.detect-version-bump.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare release version
        run: npm run release:prepare

      # TODO: Re-enable iOS build once we have apple dev account
      # - name: Build and Download IPA
      #   run: |
      #     eas build \
      #       --platform ios \
      #       --profile production \
      #       --non-interactive \
      #       --wait \
      #       --json > build.json

      # - name: Extract build URL
      #   id: build-ipa
      #   run: |
      #     BUILD_URL=$(cat build.json | jq -r '.[0].artifacts.buildUrl')
      #     echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      # - name: Download IPA
      #   run: |
      #     mkdir -p builds
      #     curl -L "${{ steps.build.outputs.build_url }}" \
      #       --output builds/app.ipa

      # - name: Publish Release
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: ./builds/app.ipa
      #     tag_name: ${{ github.ref_name }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APK on EAS
        id: build-apk
        run: npm run release:build-android

      - name: Download APK
        run: curl -fL -o localloop.apk "${{ steps.build-apk.outputs.apk_url }}"

      - name: Write release notes
        run: npm run release:notes

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            ./localloop.apk \
            --target "$GITHUB_SHA" \
            --title "LocalLoop Mobile $APP_VERSION" \
            --notes-file release-notes.txt
